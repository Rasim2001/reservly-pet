server:
  port: 8082

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/bookings
    username: postgres
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

app:
  kafka:
    topic: booking.created
  reconciler:
    interval-ms: ${RECONCILER_INTERVAL_MS:60000}
    threshold-minutes: ${RECONCILER_THRESHOLD_MINUTES:5}

payment-service:
  base-url: ${PAYMENT_BASE_URL:http://localhost:8085}