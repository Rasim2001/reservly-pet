server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:
            - id: rooms
              uri: http://localhost:8082
              predicates:
                - Path=/api/rooms/**

            - id: bookings
              uri: http://localhost:8082
              predicates:
                - Path=/api/bookings/**

            - id: auth-login
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/login
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

            - id: auth
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
  data:
    redis:
      host: localhost
      port: 6379


