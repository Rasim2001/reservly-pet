server:
  port: 8083

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/notifications
    username: postgres
    password: ${DB_PASSWORD:root}
  jpa:
      hibernate:
        ddl-auto: validate
      show-sql: ${SHOW_SQL:false}
      open-in-view: false
  flyway:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.reservly.notification.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.reservly.notification.event.BookingCreatedEvent

app:
  kafka:
    topic: booking.created