services:
  adminer:
    image: adminer:5
    ports:
      - "8090:8080"

  auth-db:
    ports: ["5434:5432"]

  booking-db:
    ports: ["5433:5432"]

  payment-db:
    ports: ["5435:5432"]

  notification-db:
    ports: ["5436:5432"]

  redis:
    ports: ["6379:6379"]

  kafka:
    ports: [ "9094:9094" ]
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

  booking-service:
    environment:
      SHOW_SQL: "true"
      RECONCILER_INTERVAL_MS: "10000"
      RECONCILER_THRESHOLD_MINUTES: "1"

  auth-service:
    ports: [ "8081:8081" ]

  payment-service:
      ports: [ "8085:8085" ]